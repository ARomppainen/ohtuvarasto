{% extends "base.html" %}

{% block title %}Muokkaa varastoa - Ohtuvarasto{% endblock %}

{% block content %}
<div class="container">
    <a href="{{ url_for('index') }}" class="back-link">&larr; Takaisin</a>
    <h1>Muokkaa varastoa: {{ warehouse.nimi if warehouse.nimi else 'Varasto ' ~ warehouse.id }}</h1>
    <form action="{{ url_for('edit', warehouse_id=warehouse.id) }}" method="post">
        <label for="nimi">Varaston nimi:</label>
        <input type="text" id="nimi" name="nimi" value="{{ warehouse.nimi }}" required>

        <label for="tilavuus">Tilavuus:</label>
        <input type="number" id="tilavuus" name="tilavuus" step="0.01" min="0" value="{{ warehouse.varasto.tilavuus }}" required>

        <label for="alku_saldo">Alkusaldo:</label>
        <input type="number" id="alku_saldo" name="alku_saldo" step="0.01" min="0" value="{{ warehouse.varasto.saldo }}">

        <button type="submit">Tallenna muutokset</button>
        <a href="{{ url_for('index') }}" class="button secondary-btn">Peruuta</a>
    </form>
</div>
{% endblock %}
