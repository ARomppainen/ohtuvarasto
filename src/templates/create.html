{% extends "base.html" %}

{% block title %}Luo varasto - Ohtuvarasto{% endblock %}

{% block content %}
<div class="container">
    <a href="{{ url_for('index') }}" class="back-link">&larr; Takaisin</a>
    <h1>Luo uusi varasto</h1>
    <form action="{{ url_for('create') }}" method="post">
        <label for="nimi">Varaston nimi:</label>
        <input type="text" id="nimi" name="nimi" required>

        <label for="tilavuus">Tilavuus:</label>
        <input type="number" id="tilavuus" name="tilavuus" step="0.01" min="0" required>

        <label for="alku_saldo">Alkusaldo:</label>
        <input type="number" id="alku_saldo" name="alku_saldo" step="0.01" min="0" value="0">

        <button type="submit">Luo varasto</button>
        <a href="{{ url_for('index') }}" class="button secondary-btn">Peruuta</a>
    </form>
</div>
{% endblock %}
